# Prose lint for Antora AsciiDoc in this hub.
# Styles are downloaded via `vale sync` (local or CI).
StylesPath = .vale/styles
Packages = Microsoft
MinAlertLevel = error

[*.adoc]
BasedOnStyles = Microsoft

# Technical docs: API/SDK acronyms, URLs, and "agent" as coding assistant.
Microsoft.HeadingAcronyms = NO
Microsoft.GeneralURL = NO
Microsoft.Terms = NO
Microsoft.FirstPerson = NO
